; =============================================================================
; PlatformIO Project Configuration for clocksmith
; =============================================================================
;
; QUICK START
; -----------
; 1. Pick one of the [env:...] sections below that matches your board and
;    uncomment it (remove the leading semicolons).
; 2. Run: pio run  (or use the PlatformIO IDE button)
;
; ADDING NEW BOARDS
; -----------------
; Copy any [env:...] block, change the platform/board values, and you have a
; new build target.  All core logic and interface code will recompile
; unchanged because it is hardware-agnostic.
;
; HAL IMPLEMENTATIONS
; -------------------
; When your concrete motor/display drivers in hal/ are ready to compile,
; uncomment the lib_extra_dirs line below so PlatformIO discovers them.
;
; See: https://docs.platformio.org/en/latest/projectconf/index.html
; =============================================================================

[platformio]
; Uncomment when concrete HAL drivers in hal/ are ready to build:
; lib_extra_dirs = hal

; ---------------------------------------------------------------------------
; Example environment: Arduino Uno (AVR 8-bit)
; ---------------------------------------------------------------------------
[env:arduino_uno]
platform  = atmelavr
board     = uno
framework = arduino
; build_flags tells the compiler to search our include/ directory for headers.
; PlatformIO usually adds this automatically, but it is listed here explicitly
; so every developer knows the project-wide include root.
build_flags = -I include

; ---------------------------------------------------------------------------
; Example environment: ESP32 (uncomment to use)
; ---------------------------------------------------------------------------
; [env:esp32]
; platform  = espressif32
; board     = esp32dev
; framework = arduino
; build_flags = -I include

; ---------------------------------------------------------------------------
; Example environment: Teensy 4.1 (uncomment to use)
; ---------------------------------------------------------------------------
; [env:teensy41]
; platform  = teensy
; board     = teensy41
; framework = arduino
; build_flags = -I include
